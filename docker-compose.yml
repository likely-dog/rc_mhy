services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    environment: &app-env
      DATABASE_URL: sqlite+aiosqlite:////data/app.db
      REDIS_URL: redis://redis:6379/0
      VENDORS_CONFIG_PATH: /app/config/vendors.yaml
      ADS_A_TOKEN: ${ADS_A_TOKEN:-demo-token}
      CRM_B_KEY: ${CRM_B_KEY:-demo-key}
    volumes:
      - sqlite-data:/data
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "app.worker.consumer"]
    environment:
      <<: *app-env
      CONSUMER_NAME: worker-1
    volumes:
      - sqlite-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,redis; redis.Redis.from_url(os.environ['REDIS_URL']).ping()"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  redis-data:
  sqlite-data:
